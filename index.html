<style>
  :root {
    --bg-0: #0f1115;       /* page background — lifted from pure black */
    --bg-1: #161922;       /* surfaces */
    --bg-2: #1c2030;       /* elevated surfaces */
    --bg-3: #232838;       /* hovered / interactive */
    --bg-4: #2c3245;       /* borders+ */
    --border: #2a3042;
    --border-strong: #353c52;
    --text-0: #f3f4f8;
    --text-1: #c8ccda;
    --text-2: #8b91a5;
    --text-3: #5b6178;
    --primary: #f43f5e;
    --primary-hover: #e11d48;
    --primary-soft: rgba(244, 63, 94, 0.12);
  }
  html, body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg-0); color: var(--text-0); }
  * { -webkit-tap-highlight-color: transparent; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
 
  /* Status dot colors */
  .dot-red    { background: #f43f5e; }
  .dot-orange { background: #fb923c; }
  .dot-yellow { background: #facc15; }
  .dot-green  { background: #34d399; }
  .dot-blue   { background: #60a5fa; }
  .dot-gray   { background: #94a3b8; }
 
  /* Severity */
  .sev-low    { background: rgba(52,211,153,0.12); color: #6ee7b7; border: 1px solid rgba(52,211,153,0.3); }
  .sev-medium { background: rgba(250,204,21,0.12); color: #fde047; border: 1px solid rgba(250,204,21,0.3); }
  .sev-high   { background: rgba(244,63,94,0.15); color: #fda4af; border: 1px solid rgba(244,63,94,0.4); }
 
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-hover); }
  .text-primary { color: var(--primary); }
  .bg-primary { background: var(--primary); }
  .bg-primary-soft { background: var(--primary-soft); }
  .border-primary { border-color: var(--primary); }
 
  /* Pulse */
  @keyframes pulse-dot { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.25); } }
  .pulse-dot { animation: pulse-dot 1.5s ease-in-out infinite; }
 
  /* Slide in */
  @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
  @keyframes slideInBackdrop { from { opacity: 0; } to { opacity: 1; } }
  .slide-in { animation: slideIn 0.28s cubic-bezier(0.32, 0.72, 0, 1); }
  .backdrop-in { animation: slideInBackdrop 0.2s ease-out; }
 
  /* Message fade */
  @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg-in { animation: msgIn 0.25s ease-out; }
 
  /* Inputs */
  input[type="checkbox"], input[type="radio"] { accent-color: var(--primary); }
  select, input, textarea { color-scheme: dark; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--border-strong); }
 
  /* Context menu */
  .ctx-menu {
    background: var(--bg-2);
    border: 1px solid var(--border);
    box-shadow: 0 10px 38px -10px rgba(0,0,0,0.6), 0 10px 20px -15px rgba(0,0,0,0.5);
  }
 
  /* Custom checkbox for table column setting */
  .check-box {
    width: 18px; height: 18px; border-radius: 5px;
    border: 1.5px solid var(--border-strong);
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--bg-1);
    cursor: pointer;
  }
  .check-box.on { background: var(--primary); border-color: var(--primary); }
</style>
</head>

const STORAGE_KEY = 'carelink-v1';
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch { return null; }
}
function saveState(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
}
 
/* ========================================================================
   HELPERS
   ======================================================================== */
function timeAgo(ts) {
  const diff = Date.now() - ts;
  const sec = Math.floor(diff/1000);
  if (sec < 60) return `${sec}s ago`;
  const min = Math.floor(sec/60);
  if (min < 60) return `${min} min ago`;
  const hr = Math.floor(min/60);
  if (hr < 24) return `${hr}h ago`;
  const d = Math.floor(hr/24);
  return `${d}d ago`;
}
function formatTime(ts) {
  const d = new Date(ts);
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2,'0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${String(h).padStart(2,'0')}:${m} ${ampm}`;
}
function formatDate(ts) {
  const d = new Date(ts);
  return `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}/${d.getFullYear()}`;
}
function severityLabel(s) {
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
}
 
/* ========================================================================
   APP ROOT
   ======================================================================== */
function App() {
  const initial = loadState();
  const [employees, setEmployees] = useState(initial?.employees || SEED_EMPLOYEES);
  const [residents, setResidents] = useState(initial?.residents || SEED_RESIDENTS);
  const [cfsList, setCfsList]     = useState(initial?.cfsList   || SEED_CFS);
 
  useEffect(() => {
    saveState({ employees, residents, cfsList });
  }, [employees, residents, cfsList]);
 
  const [routeParams, setRouteParams] = useState(() => new URLSearchParams(window.location.search));
  useEffect(() => {
    const handler = () => setRouteParams(new URLSearchParams(window.location.search));
    window.addEventListener('popstate', handler);
    return () => window.removeEventListener('popstate', handler);
  }, []);
 
  const residentParam = routeParams.get('resident');
  const cfsParam = routeParams.get('cfs');
 
  const [tick, setTick] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setTick(t => t+1), 8000);
    return () => clearInterval(id);
  }, []);
 
  const addCfs = useCallback((cfs) => setCfsList(prev => [cfs, ...prev]), []);
  const updateCfs = useCallback((id, updater) => setCfsList(prev => prev.map(c => c.id === id ? updater(c) : c)), []);
 
  if (residentParam) {
    const resident = residents.find(r => r.id === residentParam);
    return <MobileQRFlow
      resident={resident} residentParam={residentParam}
      employees={employees} nursingHome={NURSING_HOME}
      cfsList={cfsList} addCfs={addCfs} updateCfs={updateCfs}
      cfsParam={cfsParam} tick={tick}
    />;
  }
 
  return <DesktopDashboard
    employees={employees} setEmployees={setEmployees}
    residents={residents} setResidents={setResidents}
    cfsList={cfsList} addCfs={addCfs} updateCfs={updateCfs}
    nursingHome={NURSING_HOME} tick={tick}
  />;
}

/* ========================================================================
   ACTIVE CFS PAGE
   ======================================================================== */
function ActiveCFSPage({ cfsList, residents, onView, onCloseCfs }) {
  const [filter, setFilter] = useState('active');
  const [search, setSearch] = useState('');
 
  const filtered = cfsList
    .filter(c => filter === 'all' ? true : c.status === filter)
    .filter(c => {
      if (!search) return true;
      const q = search.toLowerCase();
      const r = residents.find(r => r.id === c.residentId);
      return c.refNumber.includes(q)
        || c.emergencyType.toLowerCase().includes(q)
        || (r && r.name.toLowerCase().includes(q))
        || (r && r.room.includes(q));
    });
 
  const stats = {
    active: cfsList.filter(c=>c.status==='active').length,
    total: cfsList.length,
    closedToday: cfsList.filter(c=>c.status==='closed' && Date.now()-c.createdAt < 86400000).length,
  };
 
  const cols = [
    { id: 'ref',      header: 'Ref #',     width: '110px' },
    { id: 'resident', header: 'Resident',  width: '1.3fr' },
    { id: 'room',     header: 'Room',      width: '80px'  },
    { id: 'emerg',    header: 'Emergency', width: '1.5fr' },
    { id: 'severity', header: 'Severity',  width: '110px' },
    { id: 'reporter', header: 'Reported By', width: '1fr' },
    { id: 'source',   header: 'Source',    width: '110px' },
    { id: 'time',     header: 'Time',      width: '120px' },
    { id: 'status',   header: 'Status',    width: '100px' },
  ];
 
  const renderCell = (c, colId) => {
    const r = residents.find(x => x.id === c.residentId);
    switch (colId) {
      case 'ref': return <span className="font-mono text-[12px]" style={{ color: 'var(--text-1)' }}>{c.refNumber}</span>;
      case 'resident': return <span className="text-[13px] font-medium">{r ? r.name : 'Unknown'}</span>;
      case 'room': return <span className="text-[13px]">{r ? r.room : '\u2014'}</span>;
      case 'emerg': return <span className="text-[13px] truncate">{c.emergencyType}</span>;
      case 'severity': return (
        <div className="flex items-center gap-1.5">
          <span className={`w-1.5 h-1.5 rounded-full ${c.severity==='high' ? 'dot-red' : c.severity==='medium' ? 'dot-yellow' : 'dot-green'}`}/>
          <span className="text-[13px] capitalize">{c.severity}</span>
        </div>
      );
      case 'reporter': return (
        <div className="min-w-0">
          <div className="text-[13px] truncate">{c.employeeName}</div>
          {c.employeeManual && <div className="text-[10px]" style={{ color: 'var(--text-3)' }}>manual entry</div>}
        </div>
      );
      case 'source': return (
        <div className="flex items-center gap-1.5 text-[12px]" style={{ color: 'var(--text-1)' }}>
          {c.source === 'qr' ? <Icon.QR className="w-3.5 h-3.5"/> : <Icon.Layout className="w-3.5 h-3.5"/>}
          <span>{c.source === 'qr' ? 'QR Scan' : 'System'}</span>
        </div>
      );
      case 'time': return (
        <div>
          <div className="text-[12px]" style={{ color: 'var(--text-1)' }}>{timeAgo(c.createdAt)}</div>
          <div className="text-[10px]" style={{ color: 'var(--text-3)' }}>{formatTime(c.createdAt)}</div>
        </div>
      );
      case 'status': return c.status === 'active' ? (
        <span className="inline-flex items-center gap-1.5 text-[11px] font-semibold uppercase tracking-wider text-primary">
          <span className="w-1.5 h-1.5 bg-primary rounded-full pulse-dot"/>Active
        </span>
      ) : <span className="text-[11px] uppercase tracking-wider" style={{ color: 'var(--text-3)' }}>Closed</span>;
      default: return null;
    }
  };
 
  return (
    <div className="p-7">
      <div className="grid grid-cols-3 gap-4 mb-6">
        <StatCard label="Active CFS" value={stats.active} icon={<Icon.Siren className="w-4 h-4"/>} accent/>
        <StatCard label="Total Calls" value={stats.total} icon={<Icon.Phone className="w-4 h-4"/>}/>
        <StatCard label="Closed Today" value={stats.closedToday} icon={<Icon.Check className="w-4 h-4"/>}/>
      </div>
 
      <div className="flex items-center justify-between mb-4 gap-3">
        <div className="flex p-0.5 rounded-lg" style={{ background: 'var(--bg-1)', border: '1px solid var(--border)' }}>
          {['active','all','closed'].map(f => (
            <button key={f} onClick={()=>setFilter(f)}
              className="px-3.5 py-1.5 text-[12px] font-medium rounded-md capitalize transition"
              style={{
                background: filter === f ? 'var(--bg-3)' : 'transparent',
                color: filter === f ? 'var(--text-0)' : 'var(--text-2)',
              }}>
              {f}
            </button>
          ))}
        </div>
        <div className="relative flex-1 max-w-sm">
          <Icon.Search className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2" style={{ color: 'var(--text-3)' }}/>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search by ref, resident, room\u2026"
            className="w-full rounded-lg pl-9 pr-3 py-2 text-[13px]"
            style={{ background: 'var(--bg-1)', border: '1px solid var(--border)' }}/>
        </div>
      </div>
 
      <Table
        columns={cols}
        rows={filtered}
        getRowKey={c => c.id}
        renderCell={renderCell}
        onRowClick={onView}
        rowActions={(c) => [
          { label: 'View details', onClick: () => onView(c) },
          ...(c.status === 'active' ? [{ label: 'Close call', onClick: () => onCloseCfs(c.id), danger: true }] : []),
        ]}
        emptyText="No calls match the current filter."
      />
    </div>
  );
}

    <div className="p-4 rounded-xl" style={{
      background: accent
        ? 'linear-gradient(135deg, rgba(244,63,94,0.08), var(--bg-1))'
        : 'var(--bg-1)',
      border: '1px solid ' + (accent ? 'rgba(244,63,94,0.3)' : 'var(--border)'),

        <div style={{ color: accent ? 'var(--primary)' : 'var(--text-3)' }}>{icon}</div>
      </div>
      <div className="text-3xl font-semibold mt-2 tracking-tight">{value}</div>
    </div>
  );
}
 
/* ========================================================================
   TABLE COMPONENT (matches uploaded design)
   Header: Search | Customize columns | Filter | (Add button area)
   Rows: left-click -> onRowClick, ⋮ icon -> action menu, right-click -> action menu
   ======================================================================== */
function Table({ columns, rows, getRowKey, renderCell, onRowClick, rowActions, emptyText, search, setSearch, addButton, defaultPageSize = 10 }) {
  const [visibleCols, setVisibleCols] = useState(() => columns.map(c => c.id));
  const [columnsOpen, setColumnsOpen] = useState(false);
  const [filterOpen, setFilterOpen] = useState(false);
  const [ctxMenu, setCtxMenu] = useState(null); // { x, y, row }
  const [page, setPage] = useState(1);
  const pageSize = defaultPageSize;
 
  useEffect(() => { setPage(1); }, [rows.length]);
 
  // Close context menu on click anywhere
  useEffect(() => {
    const onClick = () => setCtxMenu(null);
    if (ctxMenu) {
      window.addEventListener('click', onClick);
      window.addEventListener('scroll', onClick, true);
      return () => {
        window.removeEventListener('click', onClick);
        window.removeEventListener('scroll', onClick, true);
      };
    }
  }, [ctxMenu]);
 
  const cols = columns.filter(c => visibleCols.includes(c.id));
  const gridTemplate = cols.map(c => c.width).join(' ') + ' 48px'; // last col = action icon
 
  const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
  const pagedRows = rows.slice((page-1)*pageSize, page*pageSize);
 
  return (
    <div>
      {/* Toolbar (only show controls — Search/Customize/Filter/Add) */}
      {(search !== undefined || addButton) && (
        <div className="flex items-center gap-2 mb-4">
          {search !== undefined && (
            <div className="relative flex-1 max-w-sm">
              <Icon.Search className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2" style={{ color: 'var(--text-3)' }}/>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search"
                className="w-full rounded-lg pl-9 pr-3 py-2 text-[13px]"
                style={{ background: 'var(--bg-1)', border: '1px solid var(--border)' }}/>
            </div>
          )}
          <div className="relative">
            <button onClick={(e) => { e.stopPropagation(); setColumnsOpen(o => !o); setFilterOpen(false); }}
              className="flex items-center gap-2 px-3 py-2 rounded-lg text-[12px] font-medium transition"
              style={{ background: 'var(--bg-1)', border: '1px solid var(--border)', color: 'var(--text-1)' }}
              onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-2)'}
              onMouseLeave={e => e.currentTarget.style.background = 'var(--bg-1)'}>
              <Icon.Columns className="w-4 h-4"/>Customize columns
            </button>
            {columnsOpen && (
              <div className="absolute top-full mt-1 left-0 ctx-menu rounded-lg py-2 z-40 w-56" onClick={e => e.stopPropagation()}>
                <div className="px-3 py-1.5 text-[10px] uppercase tracking-wider font-semibold" style={{ color: 'var(--text-3)' }}>Columns</div>
                {columns.map(c => {
                  const on = visibleCols.includes(c.id);
                  return (
                    <button key={c.id}
                      onClick={() => setVisibleCols(v => on ? v.filter(x => x !== c.id) : [...v, c.id])}
                      className="w-full flex items-center gap-2.5 px-3 py-1.5 text-[13px] text-left transition"
                      style={{ color: 'var(--text-1)' }}
                      onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-3)'}
                      onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                      <span className={`check-box ${on ? 'on' : ''}`}>
                        {on && <Icon.Check className="w-3 h-3 text-white"/>}
                      </span>
                      {c.header}
                    </button>
                  );
                })}
              </div>
            )}
          </div>
          <button onClick={(e) => { e.stopPropagation(); setFilterOpen(o => !o); setColumnsOpen(false); }}
            className="flex items-center gap-2 px-3 py-2 rounded-lg text-[12px] font-medium transition"
            style={{ background: 'var(--bg-1)', border: '1px solid var(--border)', color: 'var(--text-1)' }}
            onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-2)'}
            onMouseLeave={e => e.currentTarget.style.background = 'var(--bg-1)'}>
            <Icon.Filter className="w-4 h-4"/>Filter
          </button>
          <div className="flex-1"/>
          {addButton}
        </div>
      )}
 
      {/* Table */}
      <div className="rounded-xl overflow-hidden" style={{ background: 'var(--bg-1)', border: '1px solid var(--border)' }}>
        {/* Header */}
        <div className="grid gap-4 px-5 py-3.5" style={{
          gridTemplateColumns: gridTemplate,
          borderBottom: '1px solid var(--border)',
        }}>
          {cols.map(c => (
            <div key={c.id} className="text-[12px] font-semibold" style={{ color: 'var(--text-2)' }}>{c.header}</div>
          ))}
          <div></div>
        </div>
 
        {/* Rows */}
        {pagedRows.length === 0 ? (
          <div className="py-16 text-center text-[13px]" style={{ color: 'var(--text-3)' }}>{emptyText || 'No data.'}</div>
        ) : pagedRows.map(row => (
          <div key={getRowKey(row)}
            onClick={() => onRowClick && onRowClick(row)}
            onContextMenu={(e) => {
              e.preventDefault();
              setCtxMenu({ x: e.clientX, y: e.clientY, row });
            }}
            className="grid gap-4 px-5 py-4 cursor-pointer transition items-center"
            style={{ borderBottom: '1px solid rgba(42,48,66,0.5)', gridTemplateColumns: gridTemplate }}
            onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-2)'}
            onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
            {cols.map(c => (
              <div key={c.id} className="min-w-0 truncate">{renderCell(row, c.id)}</div>
            ))}
            <div className="flex justify-end">
              <button onClick={(e) => {
                  e.stopPropagation();
                  const rect = e.currentTarget.getBoundingClientRect();
                  setCtxMenu({ x: rect.right, y: rect.bottom + 4, row, alignRight: true });
                }}
                className="p-1.5 rounded-md transition"
                style={{ color: 'var(--text-2)' }}
                onMouseEnter={e=>{e.currentTarget.style.background='var(--bg-3)'; e.currentTarget.style.color='var(--text-0)';}}
                onMouseLeave={e=>{e.currentTarget.style.background='transparent'; e.currentTarget.style.color='var(--text-2)';}}>
                <Icon.More className="w-4 h-4"/>
              </button>
            </div>
          </div>
        ))}
      </div>
 
      {/* Pagination */}
      {totalPages > 1 && (
        <div className="flex items-center justify-center gap-1 mt-5">
          <button onClick={()=>setPage(p=>Math.max(1, p-1))} disabled={page===1}
            className="flex items-center gap-1 px-3 py-1.5 rounded-md text-[12px] transition"
            style={{ color: 'var(--text-2)', opacity: page === 1 ? 0.4 : 1 }}
            onMouseEnter={e=>{ if (page !== 1) e.currentTarget.style.background = 'var(--bg-2)'; }}
            onMouseLeave={e=>{ e.currentTarget.style.background = 'transparent'; }}>
            Previous
          </button>
          {Array.from({ length: totalPages }, (_, i) => i + 1).map(p => (
            <button key={p} onClick={()=>setPage(p)}
              className="min-w-[32px] px-2 py-1.5 rounded-md text-[12px] font-medium transition"
              style={{
                background: p === page ? 'var(--bg-3)' : 'transparent',
                color: p === page ? 'var(--text-0)' : 'var(--text-2)',
                border: p === page ? '1px solid var(--border)' : '1px solid transparent',
              }}>
              {p}
            </button>
          ))}
          <button onClick={()=>setPage(p=>Math.min(totalPages, p+1))} disabled={page===totalPages}
            className="flex items-center gap-1 px-3 py-1.5 rounded-md text-[12px] transition"
            style={{ color: 'var(--text-2)', opacity: page === totalPages ? 0.4 : 1 }}>
            Next <Icon.ChevronRight className="w-3 h-3"/>
          </button>
        </div>
      )}
 
      {/* Context menu */}
      {ctxMenu && (
        <div className="fixed ctx-menu rounded-lg py-1 z-50 min-w-[180px]"
          style={{
            left: ctxMenu.alignRight ? ctxMenu.x - 180 : ctxMenu.x,
            top: ctxMenu.y,
          }}
          onClick={e => e.stopPropagation()}>
          {rowActions(ctxMenu.row).map((a, i) => (
            <button key={i}
              onClick={() => { a.onClick(); setCtxMenu(null); }}
              className="w-full text-left px-3 py-2 text-[13px] transition"
              style={{ color: a.danger ? '#fda4af' : 'var(--text-1)' }}
              onMouseEnter={e => e.currentTarget.style.background = a.danger ? 'rgba(244,63,94,0.1)' : 'var(--bg-3)'}
              onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
              {a.label}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function ResidentsPage({ residents, setResidents, onView, onEdit, onAdd, onShowQR }) {

  const filtered = residents.filter(r => {
    if (!search) return true;
    const q = search.toLowerCase();
    return r.name.toLowerCase().includes(q) || r.room.includes(q) || r.id.toLowerCase().includes(q);

  const cols = [
    { id: 'id',     header: 'ID',     width: '80px' },
    { id: 'name',   header: 'Name',   width: '1.3fr' },
    { id: 'room',   header: 'Room',   width: '80px' },
    { id: 'age',    header: 'Age',    width: '70px' },
    { id: 'gender', header: 'Gender', width: '100px' },
    { id: 'conds',  header: 'Conditions',         width: '1.5fr' },

      case 'id':     return <span className="font-mono text-[12px]" style={{ color: 'var(--text-2)' }}>{r.id}</span>;
      case 'name':   return <span className="text-[13px] font-medium">{r.name}</span>;
      case 'room':   return <span className="text-[13px]">{r.room}</span>;

      case 'gender': return <span className="text-[13px]" style={{ color: 'var(--text-1)' }}>{r.gender}</span>;
      case 'conds':  return <span className="text-[12px] truncate" style={{ color: 'var(--text-1)' }}>{r.conditions}</span>;
      case 'ec':     return (
        <div className="min-w-0">
          <div className="text-[12px] truncate">{r.emergencyContact}</div>
          <div className="text-[11px]" style={{ color: 'var(--text-3)' }}>{r.contactPhone}</div>

  return (

        columns={cols}

        onRowClick={onView}
        rowActions={(r) => [
          { label: 'View details', onClick: () => onView(r) },

/* ========================================================================
   EMERGENCY FORM PANEL
   ======================================================================== */
function EmergencyForm({ residents, employees, nursingHome, onCancel, onSubmit, lockedResidentId, isQR }) {
  const [residentId, setResidentId] = useState(lockedResidentId || '');
  const [emergencyType, setEmergencyType] = useState('');
  const [severity, setSeverity] = useState('medium');
  const [description, setDescription] = useState('');
  const [employeeMode, setEmployeeMode] = useState('select');
  const [employeeName, setEmployeeName] = useState('');
  const [manualName, setManualName] = useState('');
 
  const finalEmployeeName = employeeMode === 'manual' ? manualName : employeeName;
  const valid = residentId && emergencyType && severity && finalEmployeeName;
 
  const submit = () => {
    if (!valid) return;
    const resident = residents.find(r => r.id === residentId);
    const now = Date.now();
    const id = 'CFS' + String(Math.floor(Math.random()*900000)+100000).padStart(6,'0');
    const refNumber = String(260500000 + Math.floor(Math.random()*99999) + 1);
    onSubmit({
      id, refNumber, residentId,
      employeeName: finalEmployeeName,
      employeeManual: employeeMode === 'manual',
      emergencyType, severity, description,
      status: 'active', createdAt: now,
      source: isQR ? 'qr' : 'system',
      location: nursingHome.address,
      callerNumber: nursingHome.callerNumber,
      messages: [
        { from: 'dispatcher', text: 'Hello, this is 911 dispatch. What is your emergency?', ts: now },
        { from: 'caller', text: `${emergencyType} \u2014 ${severity} severity. ${description || ''}`.trim(), ts: now + 2000 },
        { from: 'caller', type: 'location', address: `${nursingHome.address} \u2014 Room ${resident?.room || '\u2014'}`, ts: now + 3000 },
      ],
    });
  };
 
  return (
    <>
      <PanelHeader title="Contact Emergency Services" subtitle="Initiate a live call for service to EMS dispatch" onClose={onCancel}/>
      <div className="flex-1 overflow-y-auto p-6 space-y-5">
        <div className="px-4 py-3 rounded-lg flex items-start gap-3" style={{ background: 'var(--primary-soft)', border: '1px solid rgba(244,63,94,0.3)' }}>
          <Icon.Siren className="w-4 h-4 text-primary mt-0.5 flex-shrink-0"/>
          <div className="text-[12px]" style={{ color: 'var(--text-1)' }}>
            This will start a 911 dispatch chat session. Complete all fields and review before submitting.
          </div>
        </div>
 
        <Field label="Resident">
          {lockedResidentId ? (
            <div className="rounded-lg px-3 py-2.5 text-[13px] flex items-center justify-between" style={{ background: 'var(--bg-2)', border: '1px solid var(--border)' }}>
              <span>{residents.find(r=>r.id===lockedResidentId)?.name} \u2014 Room {residents.find(r=>r.id===lockedResidentId)?.room}</span>
              <span className="text-[10px] uppercase tracking-wider" style={{ color: 'var(--text-3)' }}>From QR</span>
            </div>
          ) : (
            <select className={inputCls} style={inputStyle} value={residentId} onChange={e=>setResidentId(e.target.value)}>
              <option value="">Select resident\u2026</option>
              {residents.map(r => <option key={r.id} value={r.id}>{r.name} \u2014 Room {r.room}</option>)}
            </select>
          )}
        </Field>
 
        <Field label="Emergency Type">
          <input className={inputCls} style={inputStyle} placeholder="e.g. Fall, Chest pain, Difficulty breathing" value={emergencyType} onChange={e=>setEmergencyType(e.target.value)}/>
        </Field>
 
        <Field label="Severity Level">
          <div className="grid grid-cols-3 gap-2">
            {['low','medium','high'].map(s => (
              <button key={s} type="button" onClick={()=>setSeverity(s)}
                className={`py-2.5 rounded-lg text-[12px] font-semibold uppercase tracking-wider transition ${severity===s ? `sev-${s}` : ''}`}
                style={severity===s ? {} : { background: 'var(--bg-2)', border: '1px solid var(--border)', color: 'var(--text-3)' }}>
                {s}
              </button>
            ))}
          </div>
        </Field>
 
        <Field label="Description (optional)">
          <textarea rows={3} className={inputCls} style={inputStyle} placeholder="Symptoms, what happened, current state\u2026" value={description} onChange={e=>setDescription(e.target.value)}/>
        </Field>
 
        <div>
          <div className="flex items-center justify-between mb-1.5">
            <label className="block text-[11px] uppercase tracking-wider font-semibold" style={{ color: 'var(--text-3)' }}>Reporter</label>
            {isQR && (
              <div className="flex p-0.5 rounded-md" style={{ background: 'var(--bg-2)', border: '1px solid var(--border)' }}>
                <button type="button" onClick={()=>setEmployeeMode('select')}
                  className="px-2.5 py-1 text-[11px] rounded transition"
                  style={{ background: employeeMode==='select' ? 'var(--bg-3)' : 'transparent', color: employeeMode==='select' ? 'var(--text-0)' : 'var(--text-3)' }}>From list</button>
                <button type="button" onClick={()=>setEmployeeMode('manual')}
                  className="px-2.5 py-1 text-[11px] rounded transition"
                  style={{ background: employeeMode==='manual' ? 'var(--bg-3)' : 'transparent', color: employeeMode==='manual' ? 'var(--text-0)' : 'var(--text-3)' }}>Enter manually</button>
              </div>
            )}
          </div>
          {employeeMode === 'select' ? (
            <select className={inputCls} style={inputStyle} value={employeeName} onChange={e=>setEmployeeName(e.target.value)}>
              <option value="">Select employee\u2026</option>
              {employees.map(emp => <option key={emp.id} value={emp.name}>{emp.name} \u2014 {emp.role}</option>)}
            </select>
          ) : (
            <input className={inputCls} style={inputStyle} placeholder="Type your name" value={manualName} onChange={e=>setManualName(e.target.value)}/>
          )}
        </div>
      </div>
      <PanelFooter>
        <button onClick={onCancel} className="px-4 py-2 rounded-lg text-[13px] transition" style={{ color: 'var(--text-2)' }}>Cancel</button>
        <div className="flex-1"/>
        <button disabled={!valid} onClick={submit} className="btn-primary px-5 py-2 rounded-lg font-semibold text-[13px] disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-2">
          <Icon.Siren className="w-4 h-4"/>Submit & Open Chat
        </button>
      </PanelFooter>
    </>
  );
}
 
/* ========================================================================
   CFS VIEW PANEL (chat + details)
   ======================================================================== */
function CfsViewPanel({ cfs, resident, onClose, onSend, onCloseCfs }) {
  const [tab, setTab] = useState('chat');
  const [input, setInput] = useState('');
  const scrollRef = useRef(null);
 
  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [cfs.messages.length, tab]);
 
  const send = () => {
    if (!input.trim()) return;
    onSend(input.trim());
    setInput('');
  };
 
  return (
    <>
      <PanelHeader
        title="Call for Service"
        subtitle={`Ref #${cfs.refNumber} \u00b7 ${cfs.emergencyType}`}
        onClose={onClose}
      />
      <div className="px-6 pt-3 flex gap-1" style={{ borderBottom: '1px solid var(--border)' }}>
        {['chat','details'].map(t => (
          <button key={t} onClick={()=>setTab(t)}
            className="px-3 py-2 text-[12px] font-medium capitalize transition relative"
            style={{ color: tab === t ? 'var(--text-0)' : 'var(--text-3)' }}>
            {t}
            {tab === t && <span className="absolute bottom-0 left-2 right-2 h-0.5 rounded-full" style={{ background: 'var(--primary)' }}/>}
          </button>
        ))}
        <div className="flex-1"/>
        {cfs.status === 'active' && (
          <span className="inline-flex items-center gap-1.5 text-[11px] font-semibold uppercase tracking-wider px-2.5 py-1 rounded-md self-center" style={{ color: 'var(--primary)', background: 'var(--primary-soft)' }}>
            <span className="w-1.5 h-1.5 bg-primary rounded-full pulse-dot"/>Live
          </span>
        )}
      </div>
 
      {tab === 'chat' && (
        <>
          <div ref={scrollRef} className="flex-1 overflow-y-auto px-6 py-5 space-y-3 no-scrollbar">
            {cfs.messages.map((m, i) => <ChatBubble key={i} msg={m}/>)}
          </div>
          {cfs.status === 'active' ? (
            <div className="px-4 py-3 flex items-center gap-2" style={{ borderTop: '1px solid var(--border)' }}>
              <button className="p-2 rounded-full bg-primary text-white"><Icon.Plus className="w-4 h-4"/></button>
              <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()}
                placeholder="Message\u2026"
                className="flex-1 rounded-full px-4 py-2 text-[13px]"
                style={{ background: 'var(--bg-2)', border: '1px solid var(--border)' }}/>
              <button className="p-2" style={{ color: 'var(--text-3)' }}><Icon.Mic className="w-4 h-4"/></button>
              <button onClick={send} className="p-2 text-primary"><Icon.Send className="w-4 h-4"/></button>
            </div>
          ) : (
            <div className="px-4 py-3 text-center text-[12px]" style={{ borderTop: '1px solid var(--border)', color: 'var(--text-3)' }}>
              This call has been closed.
            </div>
          )}
        </>
      )}
 
      {tab === 'details' && (
        <div className="flex-1 overflow-y-auto p-6 space-y-5">
          <Section title="Call Information">
            <DetailRow label="Reference" value={`${cfs.refNumber} (${cfs.id})`}/>
            <DetailRow label="Status" value={cfs.status === 'active' ? (
              <span className="inline-flex items-center gap-1.5 text-primary font-medium">
                <span className="w-1.5 h-1.5 bg-primary rounded-full pulse-dot"/>Active
              </span>
            ) : <span style={{ color: 'var(--text-3)' }}>Closed</span>}/>
            <DetailRow label="Severity" value={

/* ========================================================================
   MOBILE QR FLOW
   ======================================================================== */
function MobileQRFlow({ resident, residentParam, employees, nursingHome, cfsList, addCfs, updateCfs, cfsParam, tick }) {
  if (!resident) {
    return (
      <div className="min-h-screen flex items-center justify-center p-6" style={{ background: 'var(--bg-0)' }}>
        <div className="text-center max-w-sm">
          <div className="w-16 h-16 mx-auto mb-4 rounded-2xl flex items-center justify-center" style={{ background: 'var(--primary-soft)', border: '1px solid rgba(244,63,94,0.4)' }}>
            <Icon.Siren className="w-7 h-7 text-primary"/>
          </div>
          <h1 className="text-xl font-semibold tracking-tight mb-2">Invalid QR Code</h1>
          <p className="text-sm mb-6" style={{ color: 'var(--text-2)' }}>No resident found for ID <span className="font-mono">{residentParam}</span>.</p>
          <a href={window.location.pathname} className="inline-block btn-primary px-5 py-2.5 rounded-lg text-[13px] font-semibold">Open Dashboard</a>
        </div>
      </div>
    );
  }
 
  const [screen, setScreen] = useState(cfsParam ? 'chat' : 'form');
  const [activeCfsId, setActiveCfsId] = useState(cfsParam || null);
 
  useEffect(() => {
    if (!activeCfsId) return;
    const cfs = cfsList.find(c => c.id === activeCfsId);
    if (!cfs || cfs.status !== 'active') return;
    const lastMsg = cfs.messages[cfs.messages.length - 1];
    if (lastMsg && lastMsg.from === 'caller' && Date.now() - lastMsg.ts > 15000 && !cfs._autoReplied) {
      const replies = [
        'Copy that. Please keep the resident still and monitor their breathing.',
        'Understood. EMS is en route, approximate arrival 6 minutes.',
        'Thank you. Is the resident currently conscious and responsive?',
        'Acknowledged. Please unlock the main entrance for EMS personnel.',
        'Got it. Have someone meet EMS at the front door if possible.',
      ];
      const reply = replies[Math.floor(Math.random() * replies.length)];
      updateCfs(activeCfsId, c => ({
        ...c, _autoReplied: true,
        messages: [...c.messages, { from: 'dispatcher', text: reply, ts: Date.now() }],
      }));
    }
  }, [tick, activeCfsId, cfsList, updateCfs]);
 
  const activeCfs = cfsList.find(c => c.id === activeCfsId);
 
  return (
    <div className="min-h-screen max-w-md mx-auto relative" style={{ background: 'var(--bg-0)' }}>
      {screen === 'form' && (
        <MobileFormScreen
          resident={resident} employees={employees} nursingHome={nursingHome}
          onSubmit={(cfs) => {
            addCfs(cfs);
            // Redirect to external caller-communication app
            window.location.href = 'https://moshebraunwork.github.io/caller-communication/';
          }}
        />
      )}
      {screen === 'chat' && activeCfs && (
        <MobileChatScreen
          cfs={activeCfs} resident={resident}
          onSendMessage={(text) => updateCfs(activeCfs.id, c => ({...c, _autoReplied: false, messages: [...c.messages, { from: 'caller', text, ts: Date.now() }]}))}
          onSendLocation={() => updateCfs(activeCfs.id, c => ({...c, _autoReplied: false, messages: [...c.messages, { from: 'caller', type: 'location', address: `${nursingHome.address} \u2014 Room ${resident.room}`, ts: Date.now() }]}))}
        />
      )}
    </div>
  );
}
 
function MobileFormScreen({ resident, employees, nursingHome, onSubmit }) {
  return (
    <div className="min-h-screen flex flex-col">
      <div className="px-5 pt-5 pb-3 flex items-center gap-3" style={{ borderBottom: '1px solid var(--border)' }}>
        <div className="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0" style={{ background: 'var(--primary)' }}>
          <Icon.Heart className="w-4 h-4 text-white"/>
        </div>
        <div>
          <div className="text-[15px] font-semibold tracking-tight">Contact Emergency Services</div>
          <div className="text-[11px]" style={{ color: 'var(--text-3)' }}>{resident.name} \u00b7 Room {resident.room}</div>
        </div>
      </div>
      <div className="flex-1 overflow-y-auto">
        <MobileForm resident={resident} employees={employees} nursingHome={nursingHome} onSubmit={onSubmit}/>
      </div>
    </div>
  );
}
 
function MobileForm({ resident, employees, nursingHome, onSubmit }) {
  const [emergencyType, setEmergencyType] = useState('');
  const [severity, setSeverity] = useState('medium');
  const [description, setDescription] = useState('');
  const [reporterMode, setReporterMode] = useState('select');
  const [employeeName, setEmployeeName] = useState('');
  const [manualName, setManualName] = useState('');
  const [manualPhone, setManualPhone] = useState('');
 
  const finalReporterName = reporterMode === 'manual' ? manualName : employeeName;
  const valid = emergencyType && severity && finalReporterName && (reporterMode === 'select' || manualPhone);
 
  const submit = () => {
    if (!valid) return;
    const now = Date.now();
    const id = 'CFS' + String(Math.floor(Math.random()*900000)+100000).padStart(6,'0');
    const refNumber = String(260500000 + Math.floor(Math.random()*99999) + 1);
    onSubmit({
      id, refNumber, residentId: resident.id,
      employeeName: finalReporterName,
      employeeManual: reporterMode === 'manual',
      reporterPhone: reporterMode === 'manual' ? manualPhone : null,
      emergencyType, severity, description,
      status: 'active', createdAt: now, source: 'qr',
      location: nursingHome.address,
      callerNumber: nursingHome.callerNumber,
      messages: [
        { from: 'dispatcher', text: 'Hello, this is 911 dispatch. What is your emergency?', ts: now },
        { from: 'caller', text: `${emergencyType} \u2014 ${severity} severity. ${description || ''}`.trim(), ts: now + 2000 },
        { from: 'caller', type: 'location', address: `${nursingHome.address} \u2014 Room ${resident.room}`, ts: now + 3000 },
      ],
    });
  };
 
  const req = <span className="text-primary ml-0.5">*</span>;
 
  return (
    <div className="px-5 py-5 space-y-4 pb-32">
      <div className="px-4 py-3 rounded-xl" style={{ background: 'var(--primary-soft)', border: '1px solid rgba(244,63,94,0.3)' }}>
        <div className="text-[10px] uppercase tracking-widest font-semibold text-primary mb-1">Resident (auto-filled)</div>
        <div className="text-[14px] font-semibold">{resident.name}</div>
        <div className="text-[12px]" style={{ color: 'var(--text-1)' }}>Room {resident.room} \u00b7 Age {resident.age}</div>
        <div className="text-[11px] mt-1" style={{ color: 'var(--text-2)' }}>{resident.conditions}</div>
      </div>
 
      <div>
        <label className="block text-[11px] uppercase tracking-wider font-semibold mb-1.5" style={{ color: 'var(--text-3)' }}>
          Emergency Type{req}
        </label>
        <input className={inputCls} style={inputStyle} placeholder="e.g. Fall, Chest pain" value={emergencyType} onChange={e=>setEmergencyType(e.target.value)}/>
      </div>
 
      <div>
        <label className="block text-[11px] uppercase tracking-wider font-semibold mb-1.5" style={{ color: 'var(--text-3)' }}>
          Severity{req}
        </label>
        <div className="grid grid-cols-3 gap-2">
          {['low','medium','high'].map(s => (
            <button key={s} type="button" onClick={()=>setSeverity(s)}
              className={`py-2.5 rounded-lg text-[12px] font-semibold uppercase tracking-wider transition ${severity===s ? `sev-${s}` : ''}`}
              style={severity===s ? {} : { background: 'var(--bg-2)', border: '1px solid var(--border)', color: 'var(--text-3)' }}>
              {s}
            </button>
          ))}
        </div>
      </div>
 
      <Field label="Description (optional)">
        <textarea rows={3} className={inputCls} style={inputStyle} placeholder="Symptoms, what happened\u2026" value={description} onChange={e=>setDescription(e.target.value)}/>
      </Field>
 
      <div>
        <div className="flex items-center justify-between mb-1.5">
          <label className="block text-[11px] uppercase tracking-wider font-semibold" style={{ color: 'var(--text-3)' }}>
            Reporter{req}
          </label>
          <div className="flex p-0.5 rounded-md" style={{ background: 'var(--bg-2)', border: '1px solid var(--border)' }}>
            <button type="button" onClick={()=>setReporterMode('select')}
              className="px-2.5 py-1 text-[11px] rounded transition"
              style={{ background: reporterMode==='select' ? 'var(--bg-3)' : 'transparent', color: reporterMode==='select' ? 'var(--text-0)' : 'var(--text-3)' }}>From list</button>
            <button type="button" onClick={()=>setReporterMode('manual')}
              className="px-2.5 py-1 text-[11px] rounded transition"
              style={{ background: reporterMode==='manual' ? 'var(--bg-3)' : 'transparent', color: reporterMode==='manual' ? 'var(--text-0)' : 'var(--text-3)' }}>Manually</button>
          </div>
        </div>
        {reporterMode === 'select' ? (
          <select className={inputCls} style={inputStyle} value={employeeName} onChange={e=>setEmployeeName(e.target.value)}>
            <option value="">Select employee\u2026</option>
            {employees.map(emp => <option key={emp.id} value={emp.name}>{emp.name} \u2014 {emp.role}</option>)}
          </select>
        ) : (
          <div className="space-y-2">
            <input className={inputCls} style={inputStyle} placeholder="Your full name" value={manualName} onChange={e=>setManualName(e.target.value)}/>
            <input type="tel" className={inputCls} style={inputStyle} placeholder="Mobile number" value={manualPhone} onChange={e=>setManualPhone(e.target.value)}/>
            <div className="flex items-start gap-2 px-3 py-2 rounded-lg" style={{ background: 'rgba(96,165,250,0.08)', border: '1px solid rgba(96,165,250,0.2)' }}>
              <svg className="w-3.5 h-3.5 mt-0.5 flex-shrink-0" style={{ color: '#60a5fa' }} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="16" y2="12"/><line x1="12" x2="12.01" y1="8" y2="8"/></svg>
              <div className="text-[11px] leading-snug" style={{ color: 'var(--text-1)' }}>
                You\u2019ll receive a text message to this number with a link to follow up on this call.
              </div>
            </div>
          </div>
        )}
      </div>
 
      <div className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md px-5 py-4" style={{
        background: 'linear-gradient(to top, var(--bg-0), rgba(15,17,21,0.95), transparent)',
      }}>
        <button disabled={!valid} onClick={submit}
          className="w-full btn-primary py-3.5 rounded-xl font-semibold text-[14px] flex items-center justify-center gap-2 shadow-lg shadow-rose-500/30 disabled:opacity-40 disabled:cursor-not-allowed">
          <Icon.Siren className="w-4 h-4"/>Submit Emergency
        </button>
      </div>
    </div>
  );
}
 
function MobileChatScreen({ cfs, resident, onSendMessage, onSendLocation }) {
  const [input, setInput] = useState('');
  const [attachOpen, setAttachOpen] = useState(false);
  const [detailsOpen, setDetailsOpen] = useState(false);
  const scrollRef = useRef(null);
 
  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [cfs.messages.length]);
 
  const send = () => {
    if (!input.trim()) return;
    onSendMessage(input.trim());
    setInput('');
  };
 
  return (
    <div className="min-h-screen flex flex-col">
      <div className="px-3 pt-4 pb-3 flex items-center gap-2 sticky top-0 z-10" style={{ background: 'var(--bg-0)', borderBottom: '1px solid var(--border)' }}>
        <button className="p-1" style={{ color: 'var(--text-2)' }}><Icon.ArrowLeft className="w-5 h-5"/></button>
        <div className="flex-1">
          <div className="text-[15px] font-semibold tracking-tight">Chat with Dispatcher</div>
          <div className="flex items-center gap-1.5 text-[11px] text-primary">
            <span className="w-1.5 h-1.5 bg-primary rounded-full pulse-dot"/>
            <span className="font-medium">LIVE \u00b7 Ref #{cfs.refNumber}</span>
          </div>
        </div>
        <button onClick={()=>setDetailsOpen(true)} className="p-2 rounded-lg" style={{ background: 'var(--bg-2)', border: '1px solid var(--border)' }}>
          <Icon.File className="w-4 h-4" style={{ color: 'var(--text-1)' }}/>
        </button>
      </div>
 
      <div ref={scrollRef} className="flex-1 overflow-y-auto px-4 py-4 space-y-3 no-scrollbar">
        {cfs.messages.map((m, i) => <ChatBubble key={i} msg={m}/>)}
      </div>
 
      {attachOpen && (
        <div className="absolute bottom-20 left-3 rounded-xl py-1 z-20 w-44 shadow-xl" style={{ background: 'var(--bg-2)', border: '1px solid var(--border)' }}>
          {[
            { icon: <Icon.Camera className="w-4 h-4"/>, label: 'Photo', action: ()=>setAttachOpen(false) },
            { icon: <Icon.Video className="w-4 h-4"/>, label: 'Video', action: ()=>setAttachOpen(false) },
            { icon: <Icon.File className="w-4 h-4"/>, label: 'File', action: ()=>setAttachOpen(false) },
            { icon: <Icon.MapPin className="w-4 h-4"/>, label: 'Location', action: () => { onSendLocation(); setAttachOpen(false); }},
          ].map((it, i) => (
            <button key={i} onClick={it.action}
              className="w-full flex items-center gap-3 px-3.5 py-2.5 text-[13px] transition"
              style={{ color: 'var(--text-1)' }}
              onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-3)'}
              onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
              <span style={{ color: 'var(--text-2)' }}>{it.icon}</span>{it.label}
            </button>
          ))}
        </div>
      )}
 
      <div className="px-3 py-3 flex items-center gap-2 sticky bottom-0" style={{ background: 'var(--bg-0)', borderTop: '1px solid var(--border)' }}>
        <button onClick={()=>setAttachOpen(o=>!o)} className="p-2.5 rounded-full bg-primary text-white flex-shrink-0">
          <Icon.Plus className="w-4 h-4"/>
        </button>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()}
          placeholder="Message\u2026"
          className="flex-1 rounded-full px-4 py-2.5 text-[13px]"
          style={{ background: 'var(--bg-2)', border: '1px solid var(--border)' }}/>
        <button className="p-2" style={{ color: 'var(--text-3)' }}><Icon.Mic className="w-4 h-4"/></button>
        <button onClick={send} className="p-2 text-primary"><Icon.Send className="w-4 h-4"/></button>
      </div>
 
      {/* Mobile details slide-in (also from right) */}
      {detailsOpen && (
        <div className="fixed inset-0 z-30 max-w-md mx-auto" style={{ background: 'var(--bg-0)' }}>
          <div className="slide-in h-full flex flex-col">
            <div className="px-3 pt-4 pb-3 flex items-center gap-2" style={{ borderBottom: '1px solid var(--border)' }}>
              <button onClick={()=>setDetailsOpen(false)} className="p-1" style={{ color: 'var(--text-2)' }}><Icon.ArrowLeft className="w-5 h-5"/></button>
              <div className="text-[15px] font-semibold tracking-tight">Caller Details</div>
            </div>
            <div className="flex-1 overflow-y-auto px-5 py-5 space-y-5 no-scrollbar text-[13px]">
              <Section title="Call Information">
                <DetailRow label="Reference" value={`${cfs.refNumber} (${cfs.id})`}/>
                <DetailRow label="Location" value={cfs.location}/>
                <DetailRow label="Caller Number" value={cfs.callerNumber}/>
                <DetailRow label="Requested" value={`${formatDate(cfs.createdAt)}, ${formatTime(cfs.createdAt)}`}/>
                <DetailRow label="Severity" value={
                  <span className={`inline-block px-2 py-0.5 rounded-full text-[10px] font-semibold uppercase sev-${cfs.severity}`}>{severityLabel(cfs.severity)}</span>
                }/>
              </Section>
              <Section title="Resident">
                <DetailRow label="Name" value={resident.name}/>
                <DetailRow label="Room" value={resident.room}/>
                <DetailRow label="Age" value={resident.age}/>
                <DetailRow label="Conditions" value={resident.conditions}/>
                <DetailRow label="Emergency Contact" value={`${resident.emergencyContact} \u00b7 ${resident.contactPhone}`}/>
              </Section>
              <Section title="Reporter">
                <DetailRow label="Employee" value={`${cfs.employeeName}${cfs.employeeManual ? ' (manual entry)' : ''}`}/>
                <DetailRow label="Description" value={cfs.description || '\u2014'}/>
              </Section>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
 
/* ========================================================================
   MOUNT
   ======================================================================== */
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
