<style>
  html, body { font-family: 'Inter', system-ui, sans-serif; background: #0a0a0a; color: #fff; }
  * { -webkit-tap-highlight-color: transparent; }
  /* hide scrollbar but keep scroll */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  /* Severity color tokens */
  .sev-low { background: rgba(34,197,94,0.12); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
  .sev-medium { background: rgba(234,179,8,0.12); color: #facc15; border: 1px solid rgba(234,179,8,0.3); }
  .sev-high { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.35); }
  /* primary red used in mock */
  :root {
    --bg-0: #0a0a0a;
    --bg-1: #111111;
    --bg-2: #161616;
    --bg-3: #1c1c1c;
    --border: #262626;
    --primary: #ef3b5c;
    --primary-hover: #d8334f;
  }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-hover); }
  .text-primary { color: var(--primary); }
  .bg-primary { background: var(--primary); }
  .border-primary { border-color: var(--primary); }
  /* pulsing dot */
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.2); }
  }
  .pulse-dot { animation: pulse-dot 1.5s ease-in-out infinite; }
  /* fade-in for chat messages */
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg-in { animation: msgIn 0.25s ease-out; }
  /* typing dots */
  @keyframes typing {
    0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-3px); }
  }
  .typing-dot { animation: typing 1.2s infinite; }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  /* checkbox */
  input[type="checkbox"], input[type="radio"] {
    accent-color: var(--primary);
  }
  select, input, textarea {
    color-scheme: dark;
  }
  /* hide on mobile when on desktop view & vice versa */
  .scroll-shadow {
    background:
      linear-gradient(#0a0a0a 30%, rgba(10,10,10,0)) center top,
      linear-gradient(rgba(10,10,10,0), #0a0a0a 70%) center bottom,
      radial-gradient(farthest-side at 50% 0, rgba(0,0,0,0.4), rgba(0,0,0,0)) center top,
      radial-gradient(farthest-side at 50% 100%, rgba(0,0,0,0.4), rgba(0,0,0,0)) center bottom;
    background-repeat: no-repeat;
    background-size: 100% 40px, 100% 40px, 100% 14px, 100% 14px;
    background-attachment: local, local, scroll, scroll;
  }
</style>

/* ========================================================================
   PERSISTENCE
   ======================================================================== */
const STORAGE_KEY = 'havencare-ems-v1';

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch { return null; }
}

function saveState(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
}

   HELPERS
   ======================================================================== */
function timeAgo(ts) {
  const diff = Date.now() - ts;
  const sec = Math.floor(diff/1000);
  if (sec < 60) return `${sec}s ago`;
  const min = Math.floor(sec/60);
  if (min < 60) return `${min} min ago`;
  const hr = Math.floor(min/60);
  if (hr < 24) return `${hr}h ago`;
  const d = Math.floor(hr/24);
  return `${d}d ago`;
}

function formatTime(ts) {
  const d = new Date(ts);
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2,'0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${String(h).padStart(2,'0')}:${m} ${ampm}`;
}

function formatDate(ts) {
  const d = new Date(ts);
  return `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}/${d.getFullYear()}`;
}

function nextCfsId(cfsList) {
  let max = 0;
  cfsList.forEach(c => {
    const n = parseInt(c.id.replace('CFS',''), 10);
    if (n > max) max = n;
  });
  return 'CFS' + String(max+1).padStart(6, '0');
}
function nextRefNumber(cfsList) {
  let max = 260500000;
  cfsList.forEach(c => {
    const n = parseInt(c.refNumber, 10);
    if (n > max) max = n;
  });
  return String(max+1);
}

function severityLabel(s) {
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
}

/* ========================================================================
   ROOT APP — routes between Desktop dashboard and Mobile QR flow
   ======================================================================== */
function App() {
  // Persistent state
  const initial = loadState();
  const [employees, setEmployees] = useState(initial?.employees || SEED_EMPLOYEES);
  const [residents, setResidents] = useState(initial?.residents || SEED_RESIDENTS);
  const [cfsList, setCfsList]     = useState(initial?.cfsList   || SEED_CFS);

  // Save state on change
  useEffect(() => {
    saveState({ employees, residents, cfsList });
  }, [employees, residents, cfsList]);

  // URL-based routing: ?resident=R001 => mobile QR flow; otherwise desktop dashboard
  const [routeParams, setRouteParams] = useState(() => new URLSearchParams(window.location.search));
  useEffect(() => {
    const handler = () => setRouteParams(new URLSearchParams(window.location.search));
    window.addEventListener('popstate', handler);
    return () => window.removeEventListener('popstate', handler);
  }, []);

  const residentParam = routeParams.get('resident');
  const cfsParam = routeParams.get('cfs');

  // Tick every 15s to refresh timestamps and trigger auto dispatcher messages
  const [tick, setTick] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setTick(t => t+1), 15000);
    return () => clearInterval(id);
  }, []);

  // CFS helpers exposed via context-like prop drilling
  const addCfs = useCallback((cfs) => {
    setCfsList(prev => [cfs, ...prev]);
  }, []);
  const updateCfs = useCallback((id, updater) => {
    setCfsList(prev => prev.map(c => c.id === id ? updater(c) : c));
  }, []);

  // If URL has resident param => render mobile QR/emergency flow
  if (residentParam) {
    const resident = residents.find(r => r.id === residentParam);
    return (
      <MobileQRFlow
        resident={resident}
        residentParam={residentParam}
        employees={employees}
        nursingHome={NURSING_HOME}
        cfsList={cfsList}
        addCfs={addCfs}
        updateCfs={updateCfs}
        cfsParam={cfsParam}
        tick={tick}
      />
    );
  }

  // Otherwise: desktop dashboard
  return (
    <DesktopDashboard
      employees={employees} setEmployees={setEmployees}
      residents={residents} setResidents={setResidents}
      cfsList={cfsList} addCfs={addCfs} updateCfs={updateCfs}
      nursingHome={NURSING_HOME}
      tick={tick}
    />
  );
}

      // If last message is from caller and >20s old, dispatcher replies (once)
      if (lastMsg.from === 'caller' && Date.now() - lastMsg.ts > 20000 && !cfs._autoReplied) {

        ];
        const reply = replies[Math.floor(Math.random() * replies.length)];
        updateCfs(cfs.id, c => ({
          ...c,
          _autoReplied: true,
          messages: [...c.messages, { from: 'dispatcher', text: reply, ts: Date.now() }],

/* ========================================================================
   QR CODE MODAL — generated dynamically from window.location
   ======================================================================== */
function QRModal({ resident, nursingHome, onClose }) {
  const canvasRef = useRef(null);
  const [url, setUrl] = useState('');

  useEffect(() => {
    // Build URL using current location, stripping any existing params
    const base = window.location.origin + window.location.pathname;
    const u = `${base}?resident=${resident.id}`;
    setUrl(u);
    if (canvasRef.current && window.QRCode) {
      window.QRCode.toCanvas(canvasRef.current, u, {
        width: 280,
        margin: 1,
        color: { dark: '#000000', light: '#ffffff' },
        errorCorrectionLevel: 'H',
      });
    }
  }, [resident.id]);

  const printQR = () => {
    const w = window.open('', '_blank');
    if (!w) return;
    const canvasData = canvasRef.current?.toDataURL('image/png') || '';
    w.document.write(`
      <html>
      <head><title>Emergency QR — Room ${resident.room}</title>
      <style>
        body { margin:0; font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; background:#fff; color:#000; }
        .sheet { padding: 60px 40px; max-width: 600px; margin: 0 auto; text-align:center; }
        .header { background: #ef3b5c; color: white; padding: 20px; border-radius: 12px; margin-bottom: 24px; }
        .title { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
        .sub { font-size: 14px; opacity: 0.95; margin-top: 4px; text-transform: uppercase; letter-spacing: 2px; }
        .resident { border: 3px solid #000; border-radius: 12px; padding: 24px; margin-bottom: 24px; }
        .resident .name { font-size: 32px; font-weight: 700; }
        .resident .room { font-size: 56px; font-weight: 800; margin-top: 8px; }
        .room-label { font-size: 11px; text-transform: uppercase; letter-spacing: 3px; color:#555; }
        img { display: block; margin: 0 auto; border: 4px solid #000; padding: 8px; background:#fff; }
        .instructions { font-size: 14px; color: #333; margin-top: 20px; line-height: 1.5; }
        .footer { margin-top: 40px; font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 2px; }
      </style>
      </head>
      <body><div class="sheet">
        <div class="header">
          <div class="title">⚠ EMERGENCY ⚠</div>
          <div class="sub">Scan to contact EMS</div>
        </div>
        <div class="resident">
          <div class="name">${resident.name}</div>
          <div class="room-label">Room</div>
          <div class="room">${resident.room}</div>
        </div>
        <img src="${canvasData}" alt="QR Code" />
        <div class="instructions">
          In case of medical emergency, scan this QR code with any smartphone camera to immediately contact 911 dispatch with resident information pre-filled.
        </div>
        <div class="footer">${nursingHome.name}</div>
      </div>
      <script>window.onload = () => setTimeout(() => window.print(), 300);<\/script>
      </body></html>
    `);
    w.document.close();
  };

  const download = () => {
    const link = document.createElement('a');
    link.download = `QR-${resident.id}-Room${resident.room}.png`;
    link.href = canvasRef.current.toDataURL('image/png');
    link.click();
  };

  return (
    <ModalShell title={`Emergency QR — ${resident.name}`} onClose={onClose} maxWidth="28rem"
      footer={
        <div className="flex gap-2">
          <button onClick={download} className="flex-1 px-4 py-2.5 rounded-lg text-[13px] font-semibold bg-[#1c1c1c] text-gray-200 hover:bg-[#262626] transition flex items-center justify-center gap-2">
            <Icon.Download className="w-4 h-4"/>Download
          </button>
          <button onClick={printQR} className="flex-1 btn-primary px-4 py-2.5 rounded-lg text-[13px] font-semibold flex items-center justify-center gap-2">
            <Icon.Print className="w-4 h-4"/>Print Poster
          </button>
        </div>
      }>
      <div className="p-6">
        {/* Preview poster */}
        <div className="bg-white text-black rounded-xl p-5 text-center">
          <div className="bg-primary text-white rounded-lg py-3 mb-4">
            <div className="text-lg font-extrabold tracking-tight">⚠ EMERGENCY ⚠</div>
            <div className="text-[10px] uppercase tracking-widest mt-0.5 opacity-90">Scan to contact EMS</div>
          </div>
          <div className="border-2 border-black rounded-lg p-4 mb-4">
            <div className="text-lg font-bold">{resident.name}</div>
            <div className="text-[9px] uppercase tracking-widest text-gray-600 mt-1">Room</div>
            <div className="text-4xl font-extrabold mt-0.5">{resident.room}</div>
          </div>
          <div className="flex justify-center">
            <canvas ref={canvasRef} className="border-2 border-black p-2 bg-white"/>
          </div>
          <div className="text-[10px] text-gray-600 mt-3 leading-relaxed">
            Scan with any smartphone camera to immediately contact EMS dispatch.
          </div>
        </div>
        <div className="mt-4 px-3 py-2 bg-[#161616] border border-[#262626] rounded-lg text-[11px] text-gray-400 font-mono break-all">
          {url}
        </div>
      </div>
    </ModalShell>
  );
}

/* ========================================================================
   MOBILE QR FLOW — matches uploaded mobile design
   Three screens: emergency form -> "share location"/initial -> chat
   ======================================================================== */
function MobileQRFlow({ resident, residentParam, employees, nursingHome, cfsList, addCfs, updateCfs, cfsParam, tick }) {
  // If invalid resident
  if (!resident) {
    return (
      <div className="min-h-screen bg-[#0a0a0a] text-white flex items-center justify-center p-6">
        <div className="text-center max-w-sm">
          <div className="w-16 h-16 mx-auto mb-4 rounded-2xl bg-primary/15 border border-primary/40 flex items-center justify-center">
            <Icon.Siren className="w-7 h-7 text-primary"/>
          </div>
          <h1 className="text-xl font-semibold tracking-tight mb-2">Invalid QR Code</h1>
          <p className="text-sm text-gray-400 mb-6">No resident found for ID <span className="font-mono">{residentParam}</span>.</p>
          <a href={window.location.pathname} className="inline-block btn-primary px-5 py-2.5 rounded-lg text-[13px] font-semibold">Open Dashboard</a>
        </div>
      </div>
    );
  }

  // Routing inside mobile flow: screen state
  // screens: 'intro' (location preview) -> 'form' -> 'chat'
  const [screen, setScreen] = useState(cfsParam ? 'chat' : 'intro');
  const [activeCfsId, setActiveCfsId] = useState(cfsParam || null);

  // Simulated dispatcher reply for active chat
  useEffect(() => {
    if (!activeCfsId) return;
    const cfs = cfsList.find(c => c.id === activeCfsId);
    if (!cfs || cfs.status !== 'active') return;
    const lastMsg = cfs.messages[cfs.messages.length - 1];
    if (lastMsg && lastMsg.from === 'caller' && Date.now() - lastMsg.ts > 15000 && !cfs._autoReplied) {
      const replies = [
        'Copy that. Please keep the resident still and monitor their breathing.',
        'Understood. EMS is en route, approximate arrival 6 minutes.',
        'Thank you for the update. Is the resident currently conscious and responsive?',
        'Acknowledged. Please unlock the main entrance for EMS personnel.',
        'Got it. Have someone meet EMS at the front door if possible.',
      ];
      const reply = replies[Math.floor(Math.random() * replies.length)];
      updateCfs(activeCfsId, c => ({
        ...c, _autoReplied: true,
        messages: [...c.messages, { from: 'dispatcher', text: reply, ts: Date.now() }],
      }));
    }
  }, [tick, activeCfsId, cfsList, updateCfs]);

  const activeCfs = cfsList.find(c => c.id === activeCfsId);

  return (
    <div className="min-h-screen bg-[#0a0a0a] text-white max-w-md mx-auto relative">
      {screen === 'intro' && (
        <MobileIntroScreen
          resident={resident}
          nursingHome={nursingHome}
          onContact={()=>setScreen('form')}
        />
      )}
      {screen === 'form' && (
        <MobileFormScreen
          resident={resident}
          employees={employees}
          nursingHome={nursingHome}
          onBack={()=>setScreen('intro')}
          onSubmit={(cfs) => {
            addCfs(cfs);
            setActiveCfsId(cfs.id);
            setScreen('chat');
          }}
        />
      )}
      {screen === 'chat' && activeCfs && (
        <MobileChatScreen
          cfs={activeCfs}
          resident={resident}
          onSendMessage={(text) => {
            updateCfs(activeCfs.id, c => ({
              ...c, _autoReplied: false,
              messages: [...c.messages, { from: 'caller', text, ts: Date.now() }]
            }));
          }}
          onSendLocation={() => {
            updateCfs(activeCfs.id, c => ({
              ...c, _autoReplied: false,
              messages: [...c.messages, { from: 'caller', type: 'location', address: `${nursingHome.address} — Room ${resident.room}`, ts: Date.now() }]
            }));
          }}
        />
      )}
    </div>
  );
}

      {/* Header */}
      <div className="px-5 pt-5 pb-3 flex items-center justify-between">
        <div className="flex items-center gap-2.5">
          <div className="w-9 h-9 rounded-lg bg-primary flex items-center justify-center">
            <Icon.Siren className="w-4 h-4 text-white"/>
          </div>
          <div className="font-semibold text-[15px] tracking-tight">{nursingHome.name}</div>
        </div>
        <button className="p-2 rounded-lg bg-[#1a1a1a] border border-[#262626]">

      {/* Search-like bar (decorative, matches the uploaded design) */}

        }}/>
        <div className="absolute inset-0 flex items-center justify-center">
          <div className="text-center">

              <Icon.MapPin className="w-5 h-5 text-primary"/>
            </div>
            <div className="text-[11px] text-gray-500">Resident location</div>

          <Icon.Siren className="w-4 h-4"/>
          Contact Emergency Services

        <div className="mt-2 text-center text-[10px] uppercase tracking-widest text-gray-600">Scanned from emergency QR</div>

/* --- mobile emergency form (uses same logic as desktop) --- */
function MobileFormScreen({ resident, employees, nursingHome, onBack, onSubmit }) {
  return (
    <div className="min-h-screen flex flex-col">
      <div className="px-5 pt-5 pb-3 flex items-center gap-3 border-b border-[#1a1a1a]">
        <button onClick={onBack} className="p-1 -ml-1 text-gray-400"><Icon.ArrowLeft className="w-5 h-5"/></button>
        <div>
          <div className="text-[15px] font-semibold tracking-tight">Contact Dispatcher</div>
          <div className="text-[11px] text-gray-500">{resident.name} · Room {resident.room}</div>
        </div>
      </div>
      <div className="flex-1 overflow-y-auto">
        <MobileForm resident={resident} employees={employees} nursingHome={nursingHome} onSubmit={onSubmit}/>
      </div>
    </div>
  );
}

function MobileForm({ resident, employees, nursingHome, onSubmit }) {
  const [emergencyType, setEmergencyType] = useState('');
  const [severity, setSeverity] = useState('medium');
  const [description, setDescription] = useState('');
  const [employeeMode, setEmployeeMode] = useState('select');
  const [employeeName, setEmployeeName] = useState('');
  const [manualName, setManualName] = useState('');

  const finalEmployeeName = employeeMode === 'manual' ? manualName : employeeName;
  const valid = emergencyType && severity && finalEmployeeName;

  const submit = () => {
    if (!valid) return;
    const now = Date.now();
    const id = 'CFS' + String(Math.floor(Math.random()*900000)+100000).padStart(6,'0');
    const refNumber = String(260500000 + Math.floor(Math.random()*99999) + 1);
    onSubmit({
      id, refNumber, residentId: resident.id,
      employeeName: finalEmployeeName,
      employeeManual: employeeMode === 'manual',
      emergencyType, severity, description,
      status: 'active', createdAt: now, source: 'qr',
      location: nursingHome.address,
      callerNumber: nursingHome.callerNumber,
      messages: [
        { from: 'dispatcher', text: 'Hello, this is 911 dispatch. What is your emergency?', ts: now },
        { from: 'caller', text: `${emergencyType} — ${severity} severity. ${description || ''}`.trim(), ts: now + 2000 },
        { from: 'caller', type: 'location', address: `${nursingHome.address} — Room ${resident.room}`, ts: now + 3000 },
      ],
    });
  };

  return (
    <div className="px-5 py-5 space-y-4 pb-32">
      {/* Resident pinned card */}
      <div className="px-4 py-3 rounded-xl bg-primary/10 border border-primary/30">
        <div className="text-[10px] uppercase tracking-widest text-primary font-semibold mb-1">Resident (auto-filled)</div>
        <div className="text-[14px] font-semibold">{resident.name}</div>
        <div className="text-[12px] text-gray-300">Room {resident.room} · Age {resident.age}</div>
        <div className="text-[11px] text-gray-400 mt-1">{resident.conditions}</div>
      </div>

      <Field label="Emergency Type">
        <input className={inputCls} placeholder="e.g. Fall, Chest pain" value={emergencyType} onChange={e=>setEmergencyType(e.target.value)}/>
      </Field>

      <Field label="Severity">
        <div className="grid grid-cols-3 gap-2">
          {['low','medium','high'].map(s => (
            <button key={s} type="button" onClick={()=>setSeverity(s)}
              className={`py-2.5 rounded-lg text-[12px] font-semibold uppercase tracking-wider border ${
                severity===s
                  ? (s==='low' ? 'sev-low' : s==='medium' ? 'sev-medium' : 'sev-high')
                  : 'bg-[#161616] border-[#262626] text-gray-500'
              }`}>
              {s}
            </button>
          ))}
        </div>
      </Field>

      <Field label="Description (optional)">
        <textarea rows={3} className={inputCls} placeholder="Symptoms, what happened…" value={description} onChange={e=>setDescription(e.target.value)}/>
      </Field>

      <div>
        <div className="flex items-center justify-between mb-1.5">
          <label className="block text-[11px] uppercase tracking-wider text-gray-500 font-semibold">Reporting Employee</label>
          <div className="flex bg-[#161616] border border-[#262626] rounded-md p-0.5">
            <button type="button" onClick={()=>setEmployeeMode('select')} className={`px-2.5 py-1 text-[11px] rounded ${employeeMode==='select' ? 'bg-[#2a2a2a] text-white' : 'text-gray-500'}`}>From list</button>
            <button type="button" onClick={()=>setEmployeeMode('manual')} className={`px-2.5 py-1 text-[11px] rounded ${employeeMode==='manual' ? 'bg-[#2a2a2a] text-white' : 'text-gray-500'}`}>Manually</button>
          </div>
        </div>
        {employeeMode === 'select' ? (
          <select className={inputCls} value={employeeName} onChange={e=>setEmployeeName(e.target.value)}>
            <option value="">Select employee…</option>
            {employees.map(emp => <option key={emp.id} value={emp.name}>{emp.name} — {emp.role}</option>)}
          </select>
        ) : (
          <input className={inputCls} placeholder="Type your name" value={manualName} onChange={e=>setManualName(e.target.value)}/>
        )}
      </div>

      {/* Sticky submit */}
      <div className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md px-5 py-4 bg-gradient-to-t from-[#0a0a0a] via-[#0a0a0a]/95 to-transparent">
        <button disabled={!valid} onClick={submit}
          className="w-full btn-primary py-3.5 rounded-xl font-semibold text-[14px] flex items-center justify-center gap-2 shadow-lg shadow-primary/30 disabled:opacity-40 disabled:cursor-not-allowed">
          <Icon.Siren className="w-4 h-4"/>Submit & Open Chat
        </button>
      </div>
    </div>
  );
}

/* --- mobile chat screen — matches uploaded design --- */
function MobileChatScreen({ cfs, resident, onSendMessage, onSendLocation }) {
  const [input, setInput] = useState('');
  const [attachOpen, setAttachOpen] = useState(false);
  const [detailsOpen, setDetailsOpen] = useState(false);
  const scrollRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [cfs.messages.length]);

  const send = () => {
    if (!input.trim()) return;
    onSendMessage(input.trim());
    setInput('');
  };

  return (
    <div className="min-h-screen flex flex-col">
      {/* Header */}
      <div className="px-3 pt-4 pb-3 flex items-center gap-2 border-b border-[#1a1a1a] sticky top-0 bg-[#0a0a0a] z-10">
        <button className="p-1 text-gray-400"><Icon.ArrowLeft className="w-5 h-5"/></button>
        <div className="flex-1">
          <div className="text-[15px] font-semibold tracking-tight">Chat with Dispatcher</div>
          <div className="flex items-center gap-1.5 text-[11px] text-primary">
            <span className="w-1.5 h-1.5 bg-primary rounded-full pulse-dot"/>
            <span className="font-medium">LIVE · Ref #{cfs.refNumber}</span>
          </div>
        </div>
        <button onClick={()=>setDetailsOpen(true)} className="p-2 rounded-lg bg-[#1a1a1a] border border-[#262626]">
          <Icon.File className="w-4 h-4 text-gray-300"/>
        </button>
      </div>

      {/* Messages */}
      <div ref={scrollRef} className="flex-1 overflow-y-auto px-4 py-4 space-y-3 no-scrollbar">
        {cfs.messages.map((m, i) => <ChatBubble key={i} msg={m}/>)}
      </div>

      {/* Attach popover */}
      {attachOpen && (
        <div className="absolute bottom-20 left-3 bg-[#161616] border border-[#262626] rounded-xl py-1 shadow-xl z-20 w-44">
          {[
            { icon: <Icon.Camera className="w-4 h-4"/>, label: 'Photo', action: ()=>{} },
            { icon: <Icon.Video className="w-4 h-4"/>, label: 'Video', action: ()=>{} },
            { icon: <Icon.File className="w-4 h-4"/>, label: 'File', action: ()=>{} },
            { icon: <Icon.MapPin className="w-4 h-4"/>, label: 'Location', action: () => { onSendLocation(); setAttachOpen(false); }},
          ].map((it, i) => (
            <button key={i} onClick={it.action}
              className="w-full flex items-center gap-3 px-3.5 py-2.5 text-[13px] text-gray-200 hover:bg-[#1f1f1f] transition">
              <span className="text-gray-400">{it.icon}</span>{it.label}
            </button>
          ))}
        </div>
      )}

      {/* Input bar */}
      <div className="px-3 py-3 border-t border-[#1a1a1a] flex items-center gap-2 sticky bottom-0 bg-[#0a0a0a]">
        <button onClick={()=>setAttachOpen(o=>!o)} className="p-2.5 rounded-full bg-primary text-white flex-shrink-0">
          <Icon.Plus className="w-4 h-4"/>
        </button>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send()}
          placeholder="Message…"
          className="flex-1 bg-[#161616] border border-[#262626] rounded-full px-4 py-2.5 text-[13px] focus:outline-none focus:border-[#3a3a3a]"/>
        <button className="p-2 text-gray-500"><Icon.Mic className="w-4 h-4"/></button>
        <button onClick={send} className="p-2 text-primary"><Icon.Send className="w-4 h-4"/></button>
      </div>

      {/* Details overlay (matches "Caller Details" + "Media and files" combined) */}
      {detailsOpen && (
        <div className="fixed inset-0 bg-[#0a0a0a] z-30 max-w-md mx-auto flex flex-col">
          <div className="px-3 pt-4 pb-3 flex items-center gap-2 border-b border-[#1a1a1a]">
            <button onClick={()=>setDetailsOpen(false)} className="p-1 text-gray-400"><Icon.ArrowLeft className="w-5 h-5"/></button>
            <div className="text-[15px] font-semibold tracking-tight">Caller Details</div>
          </div>
          <div className="flex-1 overflow-y-auto px-5 py-5 space-y-4 no-scrollbar text-[13px]">
            <DetailRow label="Call Reference" value={`${cfs.refNumber} (${cfs.id})`}/>
            <DetailRow label="Location" value={cfs.location}/>
            <DetailRow label="Caller Number" value={cfs.callerNumber}/>
            <DetailRow label="Caller Requested" value={`${formatDate(cfs.createdAt)}, ${formatTime(cfs.createdAt)}`}/>
            <DetailRow label="Severity" value={
              <span className={`inline-block px-2 py-0.5 rounded-full text-[10px] font-semibold uppercase sev-${cfs.severity}`}>{severityLabel(cfs.severity)}</span>
            }/>
            <div className="border-t border-[#1f1f1f] pt-4 space-y-3">
              <div className="text-[11px] uppercase tracking-wider text-gray-500 font-semibold">Resident</div>
              <DetailRow label="Name" value={resident.name}/>
              <DetailRow label="Room" value={resident.room}/>
              <DetailRow label="Age" value={resident.age}/>
              <DetailRow label="Conditions" value={resident.conditions}/>
              <DetailRow label="Emergency Contact" value={`${resident.emergencyContact} · ${resident.contactPhone}`}/>
            </div>
            <div className="border-t border-[#1f1f1f] pt-4 space-y-3">
              <div className="text-[11px] uppercase tracking-wider text-gray-500 font-semibold">Reporter</div>
              <DetailRow label="Employee" value={`${cfs.employeeName}${cfs.employeeManual ? ' (manual entry)' : ''}`}/>
              <DetailRow label="Description" value={cfs.description || '—'}/>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
